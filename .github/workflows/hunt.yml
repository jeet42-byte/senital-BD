name: Phishing hunter (every 3 hours)

# Searches Certificate Transparency logs (crt.sh) for new certificates whose
# names imitate Bangladeshi banks, MFS and telcos, and stores the lookalikes.
# Needs the DATABASE_URL repository secret.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look (use 90 once to backfill)"
        default: "7"

permissions:
  contents: read

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require a database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hunt for lookalike domains
        env:
          DAYS: ${{ inputs.days || '7' }}
        run: python -m sentinel.hunter crtsh --days "$DAYS"
