# Render Blueprint: the dashboard, API and feeds as one free web service.
# Collection does not run here; GitHub Actions does it every 6 hours.
services:
  - type: web
    name: sentinel-bd
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sentinel.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
